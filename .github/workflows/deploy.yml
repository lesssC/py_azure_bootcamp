name: Build and deploy chambaYA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP: ca-redsosten-kiosco
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
        run: |
          missing=()
          [ -z "$CLIENT_ID" ] && missing+=("AZURE_CLIENT_ID")
          [ -z "$TENANT_ID" ] && missing+=("AZURE_TENANT_ID")
          [ -z "$SUBSCRIPTION_ID" ] && missing+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$RESOURCE_GROUP" ] && missing+=("AZURE_RESOURCE_GROUP")
          [ -z "$ACR_NAME" ] && missing+=("AZURE_ACR_NAME")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltan secretos de GitHub: ${missing[*]}"
            exit 1
          fi
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/redsosten:${{ github.sha }}
      - name: Update Container App
        run: |
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/redsosten:${{ github.sha }}" \
            --min-replicas 1 \
            --max-replicas 1
